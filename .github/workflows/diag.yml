name: Diag
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_SYNC_TOKEN }}
        run: |
          echo "--- GET /user with token:"
          curl -s -o /dev/null -w "%{http_code}\n" -H "Private-Token: $GITLAB_TOKEN" https://gitlab.group.team.blue/api/v4/user || true
          echo "--- GET commits endpoint (no token):"
          curl -s -o /dev/null -w "%{http_code}\n" "https://gitlab.group.team.blue/api/v4/projects/4691/repository/commits?ref_name=main&per_page=1" || true
          echo "--- GET commits endpoint (with token):"
          curl -s -o /dev/null -w "%{http_code}\n" -H "Private-Token: $GITLAB_TOKEN" "https://gitlab.group.team.blue/api/v4/projects/4691/repository/dry-test" || true
          echo "--- HEAD on root:"
          curl -s -o /dev/null -w "%{http_code}\n" https://gitlab.group.team.blue/ || true
          echo "--- python urllib to /user:"
          python3 -c "
import os, urllib.request
t = os.environ['GITLAB_TOKEN']
req = urllib.request.Request('https://gitlab.group.team.blue/api/v4/user', headers={'Private-Token': t})
try:
    print('OK', urllib.request.urlopen(req).status)
except Exception as e:
    print('FAIL', e)
"
